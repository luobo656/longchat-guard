name: Feature request
description: Suggest an improvement that fits the product scope
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        LongChat Guard intentionally stays focused on local long-conversation warnings for chatgpt.com.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful version of the feature.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This request does not require uploading chat content to a server.
          required: true
        - label: This request does not require claiming exact OpenAI quotas or official limits.
          required: true
