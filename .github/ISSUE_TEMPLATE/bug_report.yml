name: Bug report
description: Report a reproducible problem in LongChat Guard
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve LongChat Guard.

        **Do not paste real ChatGPT conversation text, account identifiers, API keys, or attachment contents.** Use synthetic examples or screenshots with sensitive content removed.

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue and the result you expected.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Microsoft Edge
        - Other Chromium browser
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: LongChat Guard version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Sanitized screenshots or console errors are welcome.
