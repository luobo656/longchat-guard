name: Record public LongChat Guard growth metrics
on:
  schedule:
    # Monday 00:00 UTC / Monday 08:00 China Standard Time
    - cron: "0 0 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "longchat-guard-growth-metrics"
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect public aggregate counters
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/growth/collect-metrics.mjs
          node scripts/growth/verify-metrics.mjs
      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/metrics/history.json marketing/GROWTH_SCORECARD.md
          if git diff --cached --quiet; then
            echo "No metrics updates."
            exit 0
          fi
          git commit -m "chore(growth): record public weekly GitHub signals"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
