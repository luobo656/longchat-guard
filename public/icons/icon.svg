<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="LongChat Guard icon">
  <defs>
    <linearGradient id="bubble" x1="18" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31d1bc"/>
      <stop offset="0.5" stop-color="#12a28f"/>
      <stop offset="1" stop-color="#087467"/>
    </linearGradient>
    <linearGradient id="shield" x1="84" y1="70" x2="108" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb423"/>
      <stop offset="1" stop-color="#ff6514"/>
    </linearGradient>
  </defs>

  <!-- The chat bubble is the icon itself: no outer app-tile/backplate. -->
  <path d="M38 10h52c18 0 32 14 32 32v29c0 18-14 32-32 32H55l-28 16 7-20C20 96 10 85 10 71V42c0-18 14-32 32-32Z"
        fill="url(#bubble)" stroke="#076d62" stroke-width="1.5" stroke-linejoin="round"/>

  <path d="M39 43h52M39 62h39M39 81h27"
        fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>

  <path d="M96 68 119 79v15c0 14-8 25-23 31-15-6-23-17-23-31V79l23-11Z"
        fill="url(#shield)" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
</svg>
