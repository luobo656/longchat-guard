<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LongChat Guard Phase 3 Fixture</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#fafafa}
#timeline{height:420px;overflow-y:auto;border:1px solid #ddd;padding:8px}
[data-turn-key]{min-height:90px;padding:8px;border-bottom:1px solid #eee}
[data-user-message-bubble]{font-weight:600}
[data-markdown-text-style="assistant-message"]{margin-top:8px}
#composer{padding:12px;display:flex;gap:8px}
#composer-input{width:80%;height:80px}
</style>
</head>
<body>
<main>
<button data-testid="model-switcher-dropdown-button">GPT Fixture</button>
<button type="button" id="branch-in-new-chat" role="menuitem" aria-label="Branch in new chat" hidden>Branch in new chat</button>
<div id="timeline" data-app-action-timeline-scroll></div>
<form id="composer" onsubmit="return false">
<textarea id="composer-input" placeholder="询问 ChatGPT"></textarea>
<button type="button" id="send" aria-label="发送提示词">Send</button>
</form>
</main>
<script>
(function(){
  var timeline=document.getElementById('timeline');
  var prompt=document.getElementById('composer-input');
  var send=document.getElementById('send');
  var branchButton=document.getElementById('branch-in-new-chat');
  var seq=0;
  window.__phase3={scrollEvents:0,sends:0,externalMutations:0,rendererTransitionMode:false,postSettleParserLossMode:false,transientWeakTurnMode:false};
  timeline.addEventListener('scroll',function(){window.__phase3.scrollEvents+=1});

  function addTurn(id,userText,assistantText,opts){
    opts=opts||{};
    var turn=document.createElement('section');
    turn.setAttribute('data-turn-key',id);
    turn.dataset.fixtureTurn=id;
    if(opts.unknownRole){
      var unknown=document.createElement('div');
      unknown.setAttribute('data-message-author-role','mystery');
      unknown.setAttribute('data-message-id',id+'-unknown');
      unknown.textContent=userText;
      turn.appendChild(unknown);
    } else {
      var user=document.createElement('div');
      user.setAttribute('data-message-author-role','user');
      user.setAttribute('data-message-id',id+'-u');
      user.textContent=userText;
      if(opts.attachment){
        var img=document.createElement('img');
        img.setAttribute('data-testid','attachment-preview');
        img.alt='fixture attachment';
        user.appendChild(img);
      }
      turn.appendChild(user);
    }
    if(assistantText){
      var assistant=document.createElement('div');
      assistant.setAttribute('data-markdown-text-style','assistant-message');
      assistant.setAttribute('data-message-author-role','assistant');
      assistant.setAttribute('data-message-id',id+'-a');
      assistant.textContent=assistantText;
      turn.appendChild(assistant);
    }
    if(opts.tool){
      var tool=document.createElement('div');
      tool.setAttribute('data-message-author-role','tool');
      tool.setAttribute('data-testid','tool-result');
      tool.textContent='fixture tool result';
      turn.appendChild(tool);
    }
    timeline.appendChild(turn);
    timeline.scrollTop=timeline.scrollHeight;
    return turn;
  }

  window.__phase3.addExternalTurn=function(){
    window.__phase3.externalMutations+=1;
    addTurn('external-'+(++seq),'External user mutation','External assistant mutation');
  };

  // A genuine "Branch in new chat" action inherits a PREFIX of the
  // source chat and creates a DIFFERENT conversation id. The stored
  // ChatGPT source conversation must never be interpreted as a fresh chat.
  window.__phase3.enableBranch=function(options){
    options=options||{};
    window.__phase3.branchConfiguration={
      childId:options.childId||'project-branched',
      keepTurns:options.keepTurns||6,
      fromTail:options.fromTail===true
    };
    branchButton.hidden=false;
  };
  branchButton.addEventListener('click',function(){
    var config=window.__phase3.branchConfiguration;
    if(!config)return;
    var groups=Array.from(timeline.querySelectorAll('[data-turn-key]'));
    var chosen=config.fromTail
      ?groups.slice(-config.keepTurns)
      :groups.slice(0,config.keepTurns);
    var copies=chosen.map(function(group,index){
      var node=group.cloneNode(true);
      node.setAttribute('data-turn-key','branch-new-'+index);
      node.querySelectorAll('[data-message-id]').forEach(function(message){
        message.setAttribute('data-message-id',
          'branch-copy-'+index+'-'+(message.getAttribute('data-message-author-role')||'body'));
      });
      return node;
    });
    history.pushState({},'','/g/g-fixture/c/'+config.childId);
    timeline.replaceChildren.apply(timeline,copies);
    timeline.scrollTop=timeline.scrollHeight;
    branchButton.hidden=true;
    window.__phase3.branchConfiguration=undefined;
  });

  var p=location.pathname;
  if(p==='/c/parser-broken'){
    addTurn('broken-1','Ambiguous role content','',{unknownRole:true});
  } else if(
    p==='/c/limit-known' ||
    p==='/c/limit-attachment' ||
    p==='/c/sequence-live'
  ){
    for(var i=0;i<10;i+=1){
      addTurn(
        'limit-'+i,
        ('Known limit user turn '+i+' ').repeat(8),
        ('Known limit assistant turn '+i+' ').repeat(15),
        {attachment:p==='/c/limit-attachment' && i===0}
      );
    }
  } else if(p==='/c/limit-branched'){
    // A separate-tab branch loads a prefix of the already certified
    // /c/limit-known reference. HTML/DOM identities are NEW, but content
    // and order remain identical through the selected fork point.
    for(var forkIndex=0;forkIndex<7;forkIndex+=1){
      addTurn(
        'branch-copied-'+forkIndex,
        ('Known limit user turn '+forkIndex+' ').repeat(8),
        ('Known limit assistant turn '+forkIndex+' ').repeat(15)
      );
    }
  } else if(p==='/c/old-history'){
    for(var j=0;j<6;j+=1){
      addTurn(
        'old-'+j,
        ('Older chat user turn '+j+' ').repeat(4),
        ('Older chat assistant turn '+j+' ').repeat(7)
      );
    }
  } else if(p==='/c/shared'){
    addTurn('shared-0','Shared conversation user content','Shared conversation assistant content');
  } else if(p==='/g/g-fixture/c/project-empty'){
    // Project chats can load with a preassigned conversation route before
    // the first user message exists. Keep this surface intentionally empty.
  } else if(p!=='/' && p!=='/g/g-fixture'){
    addTurn('first-0','Short user message','Short assistant answer');
  }

  if(sessionStorage.getItem('phase3-parser-loss-on-load')==='1'){
    sessionStorage.removeItem('phase3-parser-loss-on-load');
    timeline.querySelectorAll('[data-turn-key]').forEach(function(node){
      node.removeAttribute('data-turn-key');
    });
    timeline.querySelectorAll('[data-message-author-role]').forEach(function(node){
      node.removeAttribute('data-message-author-role');
    });
    timeline.querySelectorAll('[data-markdown-text-style]').forEach(function(node){
      node.removeAttribute('data-markdown-text-style');
    });
  }

  function performSend(){
    var text=prompt.value.trim();
    if(!text)return;
    window.__phase3.sends+=1;
    var id='sent-'+Date.now();
    if(location.pathname==='/' || location.pathname==='/g/g-fixture'){
      var nextId=window.__phase3.nextConversationId||'new-chat';
      window.__phase3.nextConversationId='';
      var prefix=location.pathname==='/g/g-fixture'?'/g/g-fixture':'';
      history.pushState({},'',prefix+'/c/'+nextId);
    }
    var transientWeakTurn=window.__phase3.transientWeakTurnMode===true;
    var turn=addTurn(id,text,'',transientWeakTurn?{unknownRole:true}:undefined);
    prompt.value='';
    prompt.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'deleteContentBackward'}));
    var stop=document.createElement('button');
    stop.id='stop-generating';
    stop.setAttribute('aria-label','Stop generating');
    stop.textContent='Stop generating';
    document.body.appendChild(stop);
    setTimeout(function(){
      var assistant=document.createElement('div');
      assistant.setAttribute('data-markdown-text-style','assistant-message');
      assistant.setAttribute('data-message-author-role','assistant');
      assistant.setAttribute('data-message-id',id+'-a');
      assistant.textContent=('Assistant completed response for '+text+' ').repeat(3);
      turn.appendChild(assistant);
      stop.remove();
      timeline.scrollTop=timeline.scrollHeight;
      if(window.__phase3.rendererTransitionMode){
        setTimeout(function(){
          var user=turn.querySelector('[data-message-author-role="user"]');
          if(user){
            timeline.insertBefore(user,turn);
          }
          window.__phase3.rendererTransitionMode=false;
          timeline.scrollTop=timeline.scrollHeight;
        },700);
      }
      if(window.__phase3.postSettleParserLossMode){
        setTimeout(function(){
          turn.removeAttribute('data-turn-key');
          turn.querySelectorAll('[data-message-author-role]').forEach(function(node){
            node.removeAttribute('data-message-author-role');
          });
          turn.querySelectorAll('[data-markdown-text-style]').forEach(function(node){
            node.removeAttribute('data-markdown-text-style');
          });
          window.__phase3.postSettleParserLossMode=false;
          timeline.scrollTop=timeline.scrollHeight;
        },900);
      }
      if(transientWeakTurn){
        setTimeout(function(){
          var weakUser=turn.querySelector('[data-message-author-role="mystery"]');
          if(weakUser){
            weakUser.setAttribute('data-message-author-role','user');
            weakUser.setAttribute('data-user-message-bubble','');
          }
          window.__phase3.transientWeakTurnMode=false;
          timeline.scrollTop=timeline.scrollHeight;
        },1800);
      }
    },500);
  }
  window.__phase3.sendWithoutClick=performSend;
  send.addEventListener('click',performSend);
  setTimeout(function(){timeline.scrollTop=timeline.scrollHeight},0);
})();
</script>
</body>
</html>
